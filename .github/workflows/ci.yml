name: build-and-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - weka_artifact: weka-stable
            weka_version: 3.8.7
          - weka_artifact: weka-dev
            weka_version: 3.9.6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Unit and integration tests
        run: >-
          mvn --batch-mode
          -Dweka.artifactId=${{ matrix.weka_artifact }}
          -Dweka.version=${{ matrix.weka_version }}
          verify

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and install Weka package
        run: scripts/test-package.sh
      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: CompositeSEM-0.3.0
          path: |
            output/CompositeSEM-0.3.0.zip
            output/SHA256SUMS.txt

  scientific-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true
      - name: Install pinned lavaan reference
        shell: Rscript {0}
        run: |
          install.packages("remotes", repos = "https://cloud.r-project.org")
          remotes::install_version("lavaan", version = "0.7-3",
                                   repos = "https://cloud.r-project.org")
      - name: Preserve committed evidence
        run: |
          cp validation/results/lavaan-reference.csv "$RUNNER_TEMP/lavaan-reference.csv"
          cp validation/results/prediction-benchmarks.csv "$RUNNER_TEMP/prediction-benchmarks.csv"
      - name: Regenerate lavaan reference
        run: Rscript validation/lavaan/generate-reference.R
      - name: Verify committed reference is reproducible
        run: |
          python3 validation/compare-csv.py \
            "$RUNNER_TEMP/lavaan-reference.csv" \
            validation/results/lavaan-reference.csv 1e-7
          git diff --exit-code -- validation/data validation/results/reference-versions.csv
      - name: Run cross-software validation tests
        run: mvn --batch-mode verify
      - name: Generate prediction benchmarks
        run: |
          mvn -q test-compile dependency:build-classpath \
            -Dmdep.includeScope=test -Dmdep.outputFile=tmp/benchmark-classpath.txt
          java -Dweka.packageManager.offline=true \
            -cp "target/test-classes:target/classes:$(cat tmp/benchmark-classpath.txt)" \
            com.hopeproject.influencer.sem.weka.PredictionBenchmarkRunner
      - name: Verify committed benchmark is reproducible
        run: >-
          python3 validation/compare-csv.py
          "$RUNNER_TEMP/prediction-benchmarks.csv"
          validation/results/prediction-benchmarks.csv 1e-7
      - name: Upload validation evidence
        uses: actions/upload-artifact@v7
        with:
          name: scientific-validation
          path: |
            validation/results/*.csv
            target/reports/apidocs
