name: build-and-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - weka_artifact: weka-stable
            weka_version: 3.8.7
          - weka_artifact: weka-dev
            weka_version: 3.9.6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Unit and integration tests
        run: >-
          mvn --batch-mode
          -Dweka.artifactId=${{ matrix.weka_artifact }}
          -Dweka.version=${{ matrix.weka_version }}
          verify

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and install Weka package
        run: scripts/test-package.sh
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: CompositeSEM-0.2.0
          path: |
            output/CompositeSEM-0.2.0.zip
            output/SHA256SUMS.txt
